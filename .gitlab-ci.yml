# ProtoELN CI. Mirrors ProtoLIMS's checks: format, lint, type-check, test and (frontend) build,
# for the shared content package, the backend and the frontend.

workflow:
  rules:
    # Merge requests, pushes to main, and runs started by hand from the GitLab UI
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check

default:
  # Keep the major version in step with .node-version
  image: node:24-slim
  # A newer pipeline on the same branch cancels this one
  interruptible: true

# Shared set-up for every job: install pnpm and the workspace packages
.pnpm:
  variables:
    # Corepack installs the pnpm version pinned in package.json, without asking first
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm --version
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile

content-checks:
  extends: .pnpm
  stage: check
  script:
    - pnpm --dir packages/content format:check
    - pnpm --dir packages/content lint
    - pnpm --dir packages/content typecheck
    - pnpm --dir packages/content coverage

backend-checks:
  extends: .pnpm
  stage: check
  variables:
    # Keep the MongoDB server program the tests download, so later runs needn't fetch it again
    MONGOMS_DOWNLOAD_DIR: $CI_PROJECT_DIR/.mongodb-binaries
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
    - key: mongodb-binaries
      paths:
        - .mongodb-binaries
  script:
    # The temporary MongoDB server used by the tests needs libcurl, which the slim image lacks
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libcurl4 > /dev/null
    - pnpm --dir backend format:check
    - pnpm --dir backend lint
    - pnpm --dir backend typecheck
    - pnpm --dir backend coverage

frontend-checks:
  extends: .pnpm
  stage: check
  script:
    - pnpm --dir frontend format:check
    - pnpm --dir frontend lint
    - pnpm --dir frontend typecheck
    - pnpm --dir frontend coverage
    - pnpm --dir frontend build
